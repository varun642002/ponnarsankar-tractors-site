name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One deploy at a time, and never let it finish part way through publishing.
# Pull request runs get their own group: sharing it would let a PR displace a
# queued deploy of main, which would then never publish.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.run_id) || 'pages-deploy' }}
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install test dependencies
        run: npm ci

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm test

      - name: Build and check the output
        run: node build.mjs && node check.mjs

  deploy:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build the site
        run: node build.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
